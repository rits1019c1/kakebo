<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="家計簿">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1b2a41">
<title>家計簿</title>
<style>
:root{--bg:#eef1f5;--card:#fff;--tx:#1b2a41;--sub:#6b788c;--bd:#dde3ea;--in:#0f8b8d;--out:#d1495b;--ac:#1b2a41;--acx:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#0f1520;--card:#18212f;--tx:#e6ebf2;--sub:#8a97ab;--bd:#263145;--in:#35b8ba;--out:#ee6b7d;--ac:#e6ebf2;--acx:#0f1520}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"Hiragino Sans",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:560px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
h2{font-size:13px;font-weight:600;color:var(--sub);margin:0 0 10px}
.total{font-size:38px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1;min-width:0}
input,select,button{font:inherit;color:inherit;border:1px solid var(--bd);border-radius:10px;padding:10px;background:var(--bg);width:100%}
button{background:var(--ac);color:var(--acx);border:0;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--sub);border:1px solid var(--bd);font-weight:500}
button.sm{width:auto;padding:6px 10px;font-size:13px}
.seg{display:flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.seg button{background:transparent;color:var(--sub);border-radius:0;font-weight:500}
.seg button.on{background:var(--ac);color:var(--acx)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.sum b{display:block;font-size:17px}
.in{color:var(--in)}.out{color:var(--out)}
.mon{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.mon button{width:44px}
.mon strong{font-size:17px}
.tx{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--bd)}
.tx:first-of-type{border-top:0}
.tx .d{color:var(--sub);font-size:12px;width:34px}
.tx .m{flex:1;min-width:0}
.tx .m small{display:block;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .x{width:28px;padding:2px;background:transparent;color:var(--sub);border:0}
canvas{max-height:220px}
.empty{color:var(--sub);text-align:center;padding:12px}
#auth{margin-top:14vh}
#auth input{margin-bottom:8px}
#err{color:var(--out);font-size:13px;min-height:18px}
.hide{display:none}
</style>
</head>
<body>
<main>
<section id="auth" class="card hide">
  <h2>家計簿にログイン</h2>
  <input id="em" type="email" placeholder="メールアドレス" autocomplete="username">
  <input id="pw" type="password" placeholder="パスワード(6文字以上)" autocomplete="current-password">
  <div id="err"></div>
  <div class="row"><button id="login">ログイン</button><button id="signup" class="ghost">新規登録</button></div>
</section>

<section id="app" class="hide">
  <div class="card">
    <h2>貯金額</h2>
    <div class="total" id="total">¥0</div>
    <button class="ghost sm" id="init" style="margin-top:10px">初期残高を設定</button>
  </div>

  <div class="card">
    <h2>記録する</h2>
    <div class="seg" id="type" style="margin-bottom:8px"><button data-t="out" class="on">支出</button><button data-t="in">収入</button></div>
    <div class="row" style="margin-bottom:8px"><input id="date" type="date"><input id="amt" type="number" inputmode="numeric" placeholder="金額"></div>
    <div class="row" style="margin-bottom:8px"><select id="cat"></select><input id="memo" placeholder="メモ(任意)"></div>
    <button id="add">追加</button>
  </div>

  <div class="mon"><button class="ghost" id="prev">‹</button><strong id="ym"></strong><button class="ghost" id="next">›</button></div>

  <div class="card"><div class="sum">
    <div><h2>収入</h2><b class="in" id="sIn"></b></div>
    <div><h2>支出</h2><b class="out" id="sOut"></b></div>
    <div><h2>収支</h2><b id="sNet"></b></div>
  </div></div>

  <div class="card"><h2>この月の記録</h2><div id="list"></div></div>
  <div class="card"><h2>貯金額の推移(12か月)</h2><canvas id="cBal"></canvas></div>
  <div class="card"><h2>月ごとの収入と支出</h2><canvas id="cBar"></canvas></div>
  <div class="card"><h2>この月の支出の内訳</h2><canvas id="cCat"></canvas></div>

  <button class="ghost" id="logout" style="margin-bottom:24px">ログアウト</button>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,addDoc,deleteDoc,doc,setDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

// ▼ Firebaseコンソールの「ウェブアプリ」の設定をここに貼る
const firebaseConfig = {
  apiKey: "AIzaSyBRtF-1fE8KwHPCJoH4hs_LE5A0GFARa98",
  authDomain: "ritutonet.firebaseapp.com",
  projectId: "ritutonet",
  storageBucket: "ritutonet.firebasestorage.app",
  messagingSenderId: "53521919904",
  appId: "1:53521919904:web:c9077ac8d8a3cccae43ec5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = initializeFirestore(app, {localCache: persistentLocalCache({tabManager: persistentMultipleTabManager()})});

const $ = s => document.querySelector(s);
const fmt = n => (n < 0 ? "-¥" : "¥") + Math.abs(Math.round(n)).toLocaleString("ja-JP");
const CATS = {
  out: ["食費","日用品","交通費","住居","光熱費","通信費","娯楽","衣服","医療","その他"],
  in: ["給料","お小遣い","その他収入"]
};
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const sum = (a, t) => a.filter(x => x.type === t).reduce((s, x) => s + x.amount, 0);

let uid, txs = [], initial = 0, ym = today().slice(0,7), type = "out", unsubs = [], charts = {};

function setCats() { $("#cat").innerHTML = CATS[type].map(c => `<option>${c}</option>`).join(""); }
function shift(n) { let [y, m] = ym.split("-").map(Number); m += n; if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } ym = `${y}-${String(m).padStart(2,"0")}`; render(); }

onAuthStateChanged(auth, u => {
  unsubs.forEach(f => f()); unsubs = [];
  $("#auth").classList.toggle("hide", !!u);
  $("#app").classList.toggle("hide", !u);
  if (!u) return;
  uid = u.uid;
  unsubs.push(onSnapshot(collection(db, "users", uid, "tx"), s => { txs = s.docs.map(d => ({id: d.id, ...d.data()})); render(); }));
  unsubs.push(onSnapshot(doc(db, "users", uid), s => { initial = s.data()?.initial || 0; render(); }));
});

async function authDo(fn) {
  $("#err").textContent = "";
  try { await fn(auth, $("#em").value.trim(), $("#pw").value); }
  catch (e) { $("#err").textContent = "失敗: " + (e.code || e.message); }
}
$("#login").onclick = () => authDo(signInWithEmailAndPassword);
$("#signup").onclick = () => authDo(createUserWithEmailAndPassword);
$("#logout").onclick = () => signOut(auth);

document.querySelectorAll("#type button").forEach(b => b.onclick = () => {
  type = b.dataset.t;
  document.querySelectorAll("#type button").forEach(x => x.classList.toggle("on", x === b));
  setCats();
});
$("#add").onclick = async () => {
  const amount = Number($("#amt").value);
  if (!amount || amount <= 0 || !$("#date").value) return;
  await addDoc(collection(db, "users", uid, "tx"), {date: $("#date").value, type, amount, cat: $("#cat").value, memo: $("#memo").value.trim()});
  $("#amt").value = ""; $("#memo").value = "";
};
$("#init").onclick = async () => {
  const v = prompt("初期残高(円)", initial);
  if (v === null || isNaN(Number(v))) return;
  await setDoc(doc(db, "users", uid), {initial: Number(v)}, {merge: true});
};
$("#prev").onclick = () => shift(-1);
$("#next").onclick = () => shift(1);
$("#list").onclick = async e => {
  const id = e.target.dataset.del;
  if (id && confirm("この記録を削除する?")) await deleteDoc(doc(db, "users", uid, "tx", id));
};

function chart(id, cfg) { charts[id]?.destroy(); charts[id] = new Chart($("#" + id), cfg); }

function render() {
  const css = getComputedStyle(document.documentElement);
  const C = k => css.getPropertyValue(k).trim();
  Chart.defaults.color = C("--sub");
  Chart.defaults.borderColor = C("--bd");

  $("#total").textContent = fmt(initial + sum(txs, "in") - sum(txs, "out"));
  $("#ym").textContent = ym.replace("-", "年") + "月";

  const m = txs.filter(t => t.date.startsWith(ym)).sort((a, b) => b.date.localeCompare(a.date));
  const inc = sum(m, "in"), out = sum(m, "out");
  $("#sIn").textContent = fmt(inc); $("#sOut").textContent = fmt(out); $("#sNet").textContent = fmt(inc - out);

  $("#list").innerHTML = m.length ? m.map(t => `
    <div class="tx"><span class="d">${t.date.slice(8)}日</span>
    <span class="m">${t.cat}<small></small></span>
    <b class="${t.type}">${t.type === "out" ? "-" : "+"}${fmt(t.amount)}</b>
    <button class="x" data-del="${t.id}">✕</button></div>`).join("") : `<div class="empty">この月の記録はまだない</div>`;
  [...document.querySelectorAll("#list .tx")].forEach((el, i) => el.querySelector("small").textContent = m[i].memo || "");

  // 直近12か月
  const months = []; { let [y, mo] = ym.split("-").map(Number); for (let i = 0; i < 12; i++) { months.unshift(`${y}-${String(mo).padStart(2,"0")}`); mo--; if (!mo) { mo = 12; y--; } } }
  const net = a => sum(a, "in") - sum(a, "out");
  let bal = initial + net(txs.filter(t => t.date.slice(0,7) < months[0]));
  const bals = months.map(k => (bal += net(txs.filter(t => t.date.startsWith(k)))));
  const labels = months.map(k => Number(k.slice(5)) + "月");
  const base = {responsive: true, plugins: {legend: {display: false}}, scales: {y: {ticks: {callback: v => v.toLocaleString("ja-JP")}}}};

  chart("cBal", {type: "line", data: {labels, datasets: [{data: bals, borderColor: C("--tx"), backgroundColor: C("--tx"), tension: .25, pointRadius: 3}]}, options: base});
  chart("cBar", {type: "bar", data: {labels, datasets: [
    {label: "収入", data: months.map(k => sum(txs.filter(t => t.date.startsWith(k)), "in")), backgroundColor: C("--in")},
    {label: "支出", data: months.map(k => sum(txs.filter(t => t.date.startsWith(k)), "out")), backgroundColor: C("--out")}]},
    options: {...base, plugins: {legend: {display: true}}}});

  const byCat = {};
  m.filter(t => t.type === "out").forEach(t => byCat[t.cat] = (byCat[t.cat] || 0) + t.amount);
  const keys = Object.keys(byCat).sort((a, b) => byCat[b] - byCat[a]);
  chart("cCat", {type: "doughnut", data: {labels: keys, datasets: [{data: keys.map(k => byCat[k]), borderWidth: 0,
    backgroundColor: ["#1b6ca8","#d1495b","#0f8b8d","#edae49","#7a5195","#ef8354","#4f6d7a","#9bc53d","#c06c84","#8d99ae"]}]},
    options: {responsive: true, plugins: {legend: {position: "right"}}}});
}

$("#date").value = today();
setCats();
</script>
</body>
</html>
